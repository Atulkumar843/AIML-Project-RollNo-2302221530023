<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Price Predictor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="card">
    <h1>Used Car Price Predictor</h1>
    <p class="subtitle">Project 3 — Random Forest · R&sup2; &asymp; 0.93</p>

    <form id="predict-form">
      <div class="section-label">The car</div>

      <label for="company">Brand</label>
      <select id="company" name="company" required>
        <option value="" disabled selected>Select brand</option>
        {% for c in companies %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>

      <label for="car_model">Model / Trim</label>
      <select id="car_model" name="car_model" required>
        <option value="" disabled selected>Select brand first</option>
      </select>

      <div class="specs-grid" id="specs-grid">
        <div class="spec"><span class="spec-label">Fuel</span><span id="spec-fuel">—</span></div>
        <div class="spec"><span class="spec-label">Transmission</span><span id="spec-transmission">—</span></div>
        <div class="spec"><span class="spec-label">Mileage</span><span id="spec-mileage">—</span></div>
        <div class="spec"><span class="spec-label">Engine</span><span id="spec-engine">—</span></div>
        <div class="spec"><span class="spec-label">Max Power</span><span id="spec-max_power">—</span></div>
        <div class="spec"><span class="spec-label">Seats</span><span id="spec-seats">—</span></div>
      </div>

      <div class="section-label">This listing</div>

      <label for="year">Year of Purchase</label>
      <select id="year" name="year" required>
        <option value="" disabled selected>Select year</option>
        {% for y in years %}
        <option value="{{ y }}">{{ y }}</option>
        {% endfor %}
      </select>

      <label for="km_driven">Kilometers Driven</label>
      <input type="number" id="km_driven" name="km_driven" min="0" step="100" placeholder="e.g. 45000" required>

      <label for="owner">Ownership History</label>
      <select id="owner" name="owner" required>
        <option value="" disabled selected>Select ownership</option>
        {% for o in owners %}
        <option value="{{ o }}">{{ o }}</option>
        {% endfor %}
      </select>

      <label for="seller_type">Seller Type</label>
      <select id="seller_type" name="seller_type" required>
        <option value="" disabled selected>Select seller type</option>
        {% for s in seller_types %}
        <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
      </select>

      <!-- hidden fields auto-filled from the selected model's specs -->
      <input type="hidden" id="fuel" name="fuel">
      <input type="hidden" id="transmission" name="transmission">
      <input type="hidden" id="mileage" name="mileage">
      <input type="hidden" id="engine" name="engine">
      <input type="hidden" id="max_power" name="max_power">
      <input type="hidden" id="seats" name="seats">

      <button type="submit">Predict Price</button>
    </form>

    <div id="result" class="result hidden"></div>
  </div>

  <script>
    const namesByCompany = {{ names_by_company | tojson }};
    const specsByName = {{ specs_by_name | tojson }};

    const companySelect = document.getElementById("company");
    const modelSelect = document.getElementById("car_model");
    const form = document.getElementById("predict-form");
    const resultBox = document.getElementById("result");

    companySelect.addEventListener("change", () => {
      const models = namesByCompany[companySelect.value] || [];
      modelSelect.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.textContent = models.length ? "Select model" : "No models found";
      placeholder.disabled = true;
      placeholder.selected = true;
      modelSelect.appendChild(placeholder);
      models.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        modelSelect.appendChild(opt);
      });
      clearSpecs();
    });

    modelSelect.addEventListener("change", () => {
      const spec = specsByName[modelSelect.value];
      if (!spec) { clearSpecs(); return; }
      document.getElementById("spec-fuel").textContent = spec.fuel;
      document.getElementById("spec-transmission").textContent = spec.transmission;
      document.getElementById("spec-mileage").textContent = spec.mileage + " kmpl";
      document.getElementById("spec-engine").textContent = spec.engine + " CC";
      document.getElementById("spec-max_power").textContent = spec.max_power + " bhp";
      document.getElementById("spec-seats").textContent = spec.seats;

      document.getElementById("fuel").value = spec.fuel;
      document.getElementById("transmission").value = spec.transmission;
      document.getElementById("mileage").value = spec.mileage;
      document.getElementById("engine").value = spec.engine;
      document.getElementById("max_power").value = spec.max_power;
      document.getElementById("seats").value = spec.seats;
    });

    function clearSpecs() {
      ["fuel","transmission","mileage","engine","max_power","seats"].forEach(k => {
        document.getElementById("spec-" + k).textContent = "—";
        document.getElementById(k).value = "";
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      resultBox.classList.add("hidden");

      if (!document.getElementById("fuel").value) {
        resultBox.textContent = "Pick a specific model/trim first — specs auto-fill from it.";
        resultBox.className = "result error";
        resultBox.classList.remove("hidden");
        return;
      }

      const formData = new FormData(form);
      try {
        const res = await fetch("/predict", { method: "POST", body: formData });
        const data = await res.json();
        if (data.success) {
          resultBox.textContent = "Estimated Price: " + data.predicted_price;
          resultBox.className = "result success";
        } else {
          resultBox.textContent = "Error: " + data.error;
          resultBox.className = "result error";
        }
      } catch (err) {
        resultBox.textContent = "Request failed: " + err;
        resultBox.className = "result error";
      }
      resultBox.classList.remove("hidden");
    });
  </script>
</body>
</html>
